name: CD

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv build
      - if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
      - name: Export version from pyproject
        shell: bash
        run: |
          ver=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "BODY_EYE_SYNC_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build app wheel
        run: uv build --wheel --out-dir installer
      # Export the committed cross-platform lockfile for the installer. Its
      # platform markers select the CUDA 12.6 torch wheels on Windows, while uv
      # verifies every hash supplied by the package indexes during installation.
      - name: Export pinned requirements
        shell: bash
        run: |
          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file installer/requirements-win.lock
      - name: Render construct.yaml
        shell: bash
        run: uv run --no-project --with jinja2 python installer/render_construct.py
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Install constructor
        shell: bash -el {0}
        run: conda install -n base -y -c conda-forge constructor nsis
      - name: Build installer
        shell: bash -el {0}
        run: conda run -n base constructor installer/ --output-dir installer-dist
      # Constructor names the output body-eye-sync-<version>-Windows-x86_64.exe.
      # Rename to a stable, version-less filename so download links never break.
      - name: Rename installer to a stable filename
        shell: bash
        run: mv installer-dist/*.exe installer-dist/body-eye-sync.exe
      - uses: actions/upload-artifact@v7
        with:
          name: body-eye-sync-windows-installer
          path: installer-dist/*.exe
          if-no-files-found: error
      - name: Install and test the built installer
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer-dist\*.exe)[0].FullName
          Start-Process -Wait -FilePath $exe -ArgumentList '/S','/D=C:\bes'
          C:\bes\python.exe -m pip install pytest pytest-qt
          $env:QT_QPA_PLATFORM = 'offscreen'
          C:\bes\python.exe -m pytest tests
      - name: Publish installer to GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer-dist/*.exe
          fail_on_unmatched_files: true
