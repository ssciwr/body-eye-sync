[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "body-eye-sync"
version = "0.0.4"
dependencies = [
    "av",
    "boxmot>=21.0.0,<22.0.0",  # see pipeline/object_tracking.py
    "ultralytics",
    # Direct dependencies so uv can select the CUDA builds below.
    "torch",
    "torchvision",
    "click",
    "numpy",
    "opencv-python",
    "packaging",
    "pandas",
    "pillow",
    "platformdirs",
    "pyarrow",
    "pydantic",
    "pyyaml",
    "rapidfuzz",
    "scipy",
    "qtpy",
    "pyside6",
    "insightface",
    "onnxruntime>=1.21,<1.27; sys_platform == 'darwin'",
    # 1.21--1.26 targets CUDA 12/cuDNN 9; 1.27+ targets CUDA 13.
    "onnxruntime-gpu>=1.21,<1.27; sys_platform != 'darwin'",
    "faster-whisper",
    "tqdm",
    "huggingface-hub",
    "transformers>=5,<6",
    "matplotlib",
    "pympi-ling",
    "crisperwhisper[transformers]>=2.0.2",
]

authors = [
    { name = "SSC" },
]
license = "AGPL-3.0-only"
license-files = ["LICENSE.md", "NOTICE.md"]
description = "Synchronize body and eye tracking data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Github = "https://github.com/ssciwr/body-eye-sync"
Documentation = "https://ssciwr.github.io/body-eye-sync/"

# pin cuda version: CTranslate2 dlopens libcublas.so.12 by name
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]

[tool.uv]
# InsightFace and faster-whisper require the CPU distribution by name. The GPU
# wheel is API-compatible, so keep that transitive dependency only on macOS.
override-dependencies = ["onnxruntime>=1.21,<1.27; sys_platform == 'darwin'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "mkdocstrings-python",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "pytest-randomly",
    "zensical",
]

[project.scripts]
body-eye-sync = "body_eye_sync.__main__:main"
body-eye-sync-cli = "body_eye_sync.cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
