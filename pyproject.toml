[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "body-eye-sync"
version = "0.0.4"
dependencies = [
    "av",
    "boxmot>=21.0.0,<22.0.0",  # see pipeline/object_tracking.py
    "ultralytics",
    # Direct dependencies so uv can select the CUDA builds on Windows below.
    "torch",
    "torchvision",
    "click",
    "numpy",
    "opencv-python",
    "packaging",
    "pandas",
    "pillow",
    "platformdirs",
    "pyarrow",
    "pydantic",
    "pyyaml",
    "scipy",
    "qtpy",
    "pyside6",
    "insightface",
    "onnxruntime",
    "faster-whisper",
    "matplotlib",
]
authors = [
    { name = "SSC" },
]
license = "AGPL-3.0-only"
license-files = ["LICENSE.md", "NOTICE.md"]
description = "Synchronize body and eye tracking data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Github = "https://github.com/ssciwr/body-eye-sync"
Documentation = "https://ssciwr.github.io/body-eye-sync/"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "mkdocstrings-python",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "pytest-randomly",
    "zensical",
]

[project.scripts]
body-eye-sync = "body_eye_sync.__main__:main"
body-eye-sync-cli = "body_eye_sync.cli:main"
